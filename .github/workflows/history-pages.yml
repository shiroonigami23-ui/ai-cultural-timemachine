name: History encyclopedia (build & deploy to Pages)

on:
  push:
    branches: [main]
    paths: ["history/**", ".github/workflows/history-pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: history-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r history/scripts/requirements.txt
      - name: Generate branching timelines
        run: python history/scripts/make_timelines.py
      - name: Build the encyclopedia
        run: SKIP_PDF=1 python history/scripts/build_site.py
      - name: Check links
        run: python history/scripts/check_links.py
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r history/index.html history/wiki history/assets history/prompts.md _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
