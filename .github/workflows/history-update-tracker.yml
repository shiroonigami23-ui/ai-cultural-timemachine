name: Update live research tracker

on:
  workflow_dispatch:
  schedule:
    - cron: "41 2 * * 1"

permissions:
  contents: write

jobs:
  tracker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r history/scripts/requirements.txt
      - name: Fetch newest papers for each tracker stream (OpenAlex)
        run: python history/scripts/update_tracker.py
      - name: Rebuild the site
        run: |
          python history/scripts/make_links.py && python history/scripts/make_timelines.py
          SKIP_PDF=1 python history/scripts/build_site.py
          python history/scripts/check_links.py
      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "Weekly tracker update" && git push)
